name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  BUILD_NAME: java-game-ztr-test-rose

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: jfrog/setup-jfrog-cli@v4

      - name: Configure JFrog CLI server
        run: jf c add solenglatest --url="${{ secrets.JF_URL }}" --access-token="${{ secrets.JF_ACCESS_TOKEN }}" --interactive=false

      - name: Configure Maven resolver/deployer
        run: |
          jf mvn-config \
            --server-id-resolve=solenglatest --repo-resolve-releases=ztr-demo-maven-virtual --repo-resolve-snapshots=ztr-demo-maven-virtual \
            --server-id-deploy=solenglatest  --repo-deploy-releases=ztr-demo-maven-local     --repo-deploy-snapshots=ztr-demo-maven-local

      - name: Build and test
        run: jf mvn clean test -B

  build-deploy-scan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: jfrog/setup-jfrog-cli@v4

      - name: Configure JFrog CLI server
        run: jf c add solenglatest --url="${{ secrets.JF_URL }}" --access-token="${{ secrets.JF_ACCESS_TOKEN }}" --interactive=false

      - name: Configure Maven resolver/deployer
        run: |
          jf mvn-config \
            --server-id-resolve=solenglatest --repo-resolve-releases=ztr-demo-maven-virtual --repo-resolve-snapshots=ztr-demo-maven-virtual \
            --server-id-deploy=solenglatest  --repo-deploy-releases=ztr-demo-maven-local     --repo-deploy-snapshots=ztr-demo-maven-local

      - name: Build, test, and deploy
        run: jf mvn clean deploy -B --build-name="${{ env.BUILD_NAME }}" --build-number=${{ github.run_number }}

      - name: Collect environment info into build-info
        run: jf rt build-collect-env "${{ env.BUILD_NAME }}" ${{ github.run_number }}

      - name: Publish build-info to Artifactory
        run: |
          jf rt build-publish "${{ env.BUILD_NAME }}" ${{ github.run_number }} \
            --build-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Xray build scan
        run: jf build-scan "${{ env.BUILD_NAME }}" ${{ github.run_number }} --fail=false
