name: CI

on:
  push:
    branches: [ main, 'feature/**' ]

env:
  BUILD_NAME: java-game-ztr-test-rose
  JF_SERVER_ID: solenglatest
  RESOLVE_REPO: maven-selfheal-virtual
  DEPLOY_REPO: maven-local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: jfrog/setup-jfrog-cli@v4

      - name: Configure JFrog CLI server
        run: jf c add "${{ env.JF_SERVER_ID }}" --url="${{ secrets.JF_URL }}" --access-token="${{ secrets.JF_ACCESS_TOKEN }}" --interactive=false

      - name: Configure Maven resolver/deployer
        run: |
          jf mvn-config \
            --server-id-resolve="${{ env.JF_SERVER_ID }}" --repo-resolve-releases="${{ env.RESOLVE_REPO }}" --repo-resolve-snapshots="${{ env.RESOLVE_REPO }}" \
            --server-id-deploy="${{ env.JF_SERVER_ID }}"  --repo-deploy-releases="${{ env.DEPLOY_REPO }}"   --repo-deploy-snapshots="${{ env.DEPLOY_REPO }}"

      - name: Build and test
        run: jf mvn clean test -B

  build-deploy-scan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: jfrog/setup-jfrog-cli@v4

      - name: Configure JFrog CLI server
        run: jf c add "${{ env.JF_SERVER_ID }}" --url="${{ secrets.JF_URL }}" --access-token="${{ secrets.JF_ACCESS_TOKEN }}" --interactive=false

      - name: Configure Maven resolver/deployer
        run: |
          jf mvn-config \
            --server-id-resolve="${{ env.JF_SERVER_ID }}" --repo-resolve-releases="${{ env.RESOLVE_REPO }}" --repo-resolve-snapshots="${{ env.RESOLVE_REPO }}" \
            --server-id-deploy="${{ env.JF_SERVER_ID }}"  --repo-deploy-releases="${{ env.DEPLOY_REPO }}"   --repo-deploy-snapshots="${{ env.DEPLOY_REPO }}"

      - name: Build, test, and deploy
        run: jf mvn clean deploy -B --build-name="${{ env.BUILD_NAME }}" --build-number=${{ github.run_number }}

      - name: Collect environment info into build-info
        run: jf rt build-collect-env "${{ env.BUILD_NAME }}" ${{ github.run_number }}

      - name: Publish build-info to Artifactory
        run: |
          jf rt build-publish "${{ env.BUILD_NAME }}" ${{ github.run_number }} \
            --build-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Xray build scan
        run: jf build-scan "${{ env.BUILD_NAME }}" ${{ github.run_number }} --fail=false
